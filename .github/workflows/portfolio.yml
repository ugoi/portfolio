name: Portfolio checks
on:
  pull_request:
    paths: ['vite-portfolio/**', '.github/workflows/portfolio.yml']
  push:
    branches: [main]
    paths: ['vite-portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-portfolio
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portfolio-browser-evidence
          path: vite-portfolio/test-results/
          retention-days: 7
