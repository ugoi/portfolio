name: Portfolio checks
on:
  pull_request:
    paths: ['vite-portfolio/**', '.github/workflows/portfolio.yml']
  push:
    branches: [main]
    paths: ['vite-portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
